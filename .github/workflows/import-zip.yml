name: Import project ZIP

on:
  push:
    paths:
      - '.upload/project.zip'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract project to repository root
        shell: bash
        run: |
          set -euo pipefail
          ZIP='.upload/project.zip'
          test -f "$ZIP"
          rm -rf .imported
          mkdir -p .imported
          unzip -q "$ZIP" -d .imported

          mapfile -t TOP < <(find .imported -mindepth 1 -maxdepth 1 -printf '%f\n')
          if [ "${#TOP[@]}" -eq 1 ] && [ -d ".imported/${TOP[0]}" ]; then
            SRC=".imported/${TOP[0]}"
          else
            SRC=".imported"
          fi

          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.imported' -exec rm -rf {} +
          cp -a "$SRC"/. .
          rm -rf .imported .upload

      - name: Commit as 首次上传
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "首次上传"
          git push --force origin HEAD:main
