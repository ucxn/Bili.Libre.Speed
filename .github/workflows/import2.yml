name: Import project ZIP (temporary)

on: push

permissions:
  contents: write

jobs:
  import:
    if: ${{ github.event.head_commit.message != '首次上传' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract ZIP and prepare project
        shell: bash
        run: |
          set -euo pipefail
          test -f BiliVideo-Lab-trmp.zip
          rm -rf .imported
          mkdir .imported
          unzip -q BiliVideo-Lab-trmp.zip -d .imported
          mapfile -t TOP < <(find .imported -mindepth 1 -maxdepth 1 -printf '%f\n')
          if [ "${#TOP[@]}" -eq 1 ] && [ -d ".imported/${TOP[0]}" ]; then SRC=".imported/${TOP[0]}"; else SRC=".imported"; fi
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.imported' ! -name 'BiliVideo-Lab-trmp.zip' -exec rm -rf {} +
          cp -a "$SRC"/. .
          rm -rf .imported BiliVideo-Lab-trmp.zip .github/workflows/import-zip.yml .github/workflows/import2.yml
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "首次上传"
          git push --force origin HEAD:main
